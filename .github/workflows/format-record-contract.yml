name: Format v0.5 record contract

on:
  push:
    branches:
      - v05/record-contract-hardening

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply rustfmt and remove helper
        run: |
          set -euo pipefail
          cargo fmt --all
          rm .github/workflows/format-record-contract.yml
          git config user.name 'ZEKRITI Tarek'
          git config user.email 'zekriti.tarek@users.noreply.github.com'
          git add -A
          git commit -m 'style(v0.5): format scoped record contract'
          git push origin HEAD:v05/record-contract-hardening
