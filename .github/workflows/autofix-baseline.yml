name: Normalize stable baseline

on:
  push:
    branches:
      - fix/baseline-stable-197

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/baseline-stable-197
      - name: Apply exact fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("src/bin/octasoma-mcp.rs")
          text = path.read_text()
          old = "if !(MIN_BITS..=MAX_BITS).contains(&bits) || bits % 64 != 0 {"
          new = "if !(MIN_BITS..=MAX_BITS).contains(&bits) || !bits.is_multiple_of(64) {"
          if text.count(old) != 1:
              raise SystemExit("unexpected MCP bits guard")
          path.write_text(text.replace(old, new))
          PY
          cargo fmt --all
      - name: Commit and remove helper workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          git rm .github/workflows/autofix-baseline.yml
          git commit -m "fix(ci): normalize stable Rust baseline"
          git push origin HEAD:fix/baseline-stable-197
