name: Apply generation fingerprints

on:
  push:
    branches: ["feat/v05-generation-fingerprints"]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.89.0
        with:
          components: rustfmt,clippy
      - name: Apply strict interpretation binding
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match, found {count}: {old[:80]!r}")
              path.write_text(text.replace(old, new, 1))

          lib = Path("src/lib.rs")
          replace_once(
              lib,
              "mod fileguard;\npub mod fractal;\nmod generation_store;\n",
              "mod fileguard;\npub mod fractal;\nmod generation_fingerprint;\nmod generation_store;\n",
          )
          replace_once(
              lib,
              "pub use fractal::RegionView;\n",
              "pub use fractal::RegionView;\npub use generation_fingerprint::{GenerationFingerprint, SCIRUST_REVISION};\n",
          )

          hybrid = Path("src/hybrid.rs")
          replace_once(
              hybrid,
              '''    pub fn save_dir(&self, dir: &str) -> io::Result<()> {
                  crate::generation_store::save(self, dir)
              }
          ''',
              '''    pub fn save_dir(&self, dir: &str) -> io::Result<()> {
                  crate::generation_store::save(self, dir)
              }

              /// Persists a generation and binds it to an explicit interpretation
              /// fingerprint. Use this path for governed/production stores: a strict
              /// reopen can then prove that the embedding, projection, quantisation,
              /// index, calibration and SciRust foundation are unchanged.
              pub fn save_dir_with_fingerprint(
                  &self,
                  dir: &str,
                  fingerprint: &crate::GenerationFingerprint,
              ) -> io::Result<()> {
                  crate::generation_store::save_with_fingerprint(self, dir, fingerprint)
              }
          ''',
          )
          replace_once(
              hybrid,
              '''    pub fn open_dir(dir: &str, dim: usize) -> io::Result<Self> {
                  crate::generation_store::open(dir, dim)
              }
          ''',
              '''    pub fn open_dir(dir: &str, dim: usize) -> io::Result<Self> {
                  crate::generation_store::open(dir, dim)
              }

              /// Opens a generation only when its persisted interpretation fingerprint
              /// exactly matches `expected`. Legacy/unbound generations are rejected;
              /// there is no silent downgrade to integrity-only loading.
              pub fn open_dir_with_fingerprint(
                  dir: &str,
                  dim: usize,
                  expected: &crate::GenerationFingerprint,
              ) -> io::Result<Self> {
                  crate::generation_store::open_with_fingerprint(dir, dim, expected)
              }
          ''',
          )

          gen = Path("src/generation_store.rs")
          text = gen.read_text()
          text = text.replace(
              "use crate::{FractalMemory3D, HybridMemory, SketchIndex};",
              "use crate::{FractalMemory3D, GenerationFingerprint, HybridMemory, SketchIndex};",
              1,
          )
          text = text.replace(
              'const MANIFEST_MAGIC: &str = "OCTASOMA-HYBRID-GENERATION-V1";',
              'const MANIFEST_MAGIC_V1: &str = "OCTASOMA-HYBRID-GENERATION-V1";\nconst MANIFEST_MAGIC_V2: &str = "OCTASOMA-HYBRID-GENERATION-V2";',
              1,
          )
          text = text.replace("const MAX_MANIFEST_BYTES: u64 = 4096;", "const MAX_MANIFEST_BYTES: u64 = 16 * 1024;", 1)
          text = text.replace(
              "    octasoma_version: String,\n    tree_sha256: String,",
              "    octasoma_version: String,\n    fingerprint: Option<GenerationFingerprint>,\n    tree_sha256: String,",
              1,
          )
          old = '''pub(crate) fn save(memory: &HybridMemory, dir: &str) -> io::Result<()> {
              let root = Path::new(dir);
          '''
          new = '''pub(crate) fn save(memory: &HybridMemory, dir: &str) -> io::Result<()> {
              save_impl(memory, dir, None)
          }

          pub(crate) fn save_with_fingerprint(
              memory: &HybridMemory,
              dir: &str,
              fingerprint: &GenerationFingerprint,
          ) -> io::Result<()> {
              fingerprint.validate()?;
              save_impl(memory, dir, Some(fingerprint))
          }

          fn save_impl(
              memory: &HybridMemory,
              dir: &str,
              fingerprint: Option<&GenerationFingerprint>,
          ) -> io::Result<()> {
              let root = Path::new(dir);
          '''
          if old not in text:
              raise SystemExit("save wrapper anchor not found")
          text = text.replace(old, new, 1)
          text = text.replace(
              '            octasoma_version: env!("CARGO_PKG_VERSION").to_string(),\n            tree_sha256,',
              '            octasoma_version: env!("CARGO_PKG_VERSION").to_string(),\n            fingerprint: fingerprint.cloned(),\n            tree_sha256,',
              1,
          )
          old = '''pub(crate) fn open(dir: &str, dim: usize) -> io::Result<HybridMemory> {
              let root = Path::new(dir);
          '''
          new = '''pub(crate) fn open(dir: &str, dim: usize) -> io::Result<HybridMemory> {
              open_impl(dir, dim, None)
          }

          pub(crate) fn open_with_fingerprint(
              dir: &str,
              dim: usize,
              expected: &GenerationFingerprint,
          ) -> io::Result<HybridMemory> {
              expected.validate()?;
              open_impl(dir, dim, Some(expected))
          }

          fn open_impl(
              dir: &str,
              dim: usize,
              expected_fingerprint: Option<&GenerationFingerprint>,
          ) -> io::Result<HybridMemory> {
              let root = Path::new(dir);
          '''
          if old not in text:
              raise SystemExit("open wrapper anchor not found")
          text = text.replace(old, new, 1)
          text = text.replace(
              "return open_generation(root, &name, dim, Some(&expected_manifest_hash));",
              "return open_generation(\n            root,\n            &name,\n            dim,\n            Some(&expected_manifest_hash),\n            expected_fingerprint,\n        );",
              1,
          )
          text = text.replace(
              "return open_generation(root, &generation_name(generation), dim, None);",
              "return open_generation(\n            root,\n            &generation_name(generation),\n            dim,\n            None,\n            expected_fingerprint,\n        );",
              1,
          )
          text = text.replace(
              '''    // Backward compatibility for v0.4 stores. New saves never write this layout.
              HybridMemory::open_legacy_dir(dir, dim)
          }
          ''',
              '''    // Backward compatibility for v0.4 stores. Strict callers never
              // downgrade to a store with no interpretation identity.
              if expected_fingerprint.is_some() {
                  return Err(invalid(
                      "strict fingerprint open refuses a legacy store with no interpretation binding",
                  ));
              }
              HybridMemory::open_legacy_dir(dir, dim)
          }
          ''',
              1,
          )
          text = text.replace(
              '''    expected_manifest_hash: Option<&str>,
          ) -> io::Result<HybridMemory> {
          ''',
              '''    expected_manifest_hash: Option<&str>,
              expected_fingerprint: Option<&GenerationFingerprint>,
          ) -> io::Result<HybridMemory> {
          ''',
              1,
          )
          dim_anchor = '''    if manifest.dim != dim {
              return Err(io::Error::new(
                  io::ErrorKind::InvalidInput,
                  format!(
                      "hybrid store dimension mismatch: manifest {}, requested {dim}",
                      manifest.dim
                  ),
              ));
          }

              let tree_path = generation_dir.join(TREE_FILE);
          '''
          dim_replacement = '''    if manifest.dim != dim {
              return Err(io::Error::new(
                  io::ErrorKind::InvalidInput,
                  format!(
                      "hybrid store dimension mismatch: manifest {}, requested {dim}",
                      manifest.dim
                  ),
              ));
          }
          if let Some(expected) = expected_fingerprint {
              let actual = manifest.fingerprint.as_ref().ok_or_else(|| {
                  invalid("strict fingerprint open refuses an unbound generation")
              })?;
              if actual != expected {
                  return Err(invalid(
                      "hybrid generation interpretation fingerprint mismatch",
                  ));
              }
          }

              let tree_path = generation_dir.join(TREE_FILE);
          '''
          if dim_anchor not in text:
              raise SystemExit("dimension anchor not found")
          text = text.replace(dim_anchor, dim_replacement, 1)

          start = text.index("fn encode_manifest(manifest: &Manifest) -> String {")
          end = text.index("fn parse_current(raw: &str)")
          manifest_code = r'''fn encode_manifest(manifest: &Manifest) -> String {
              if let Some(fingerprint) = &manifest.fingerprint {
                  let (calibration_present, calibration) = match &fingerprint.calibration {
                      Some(value) => (1, value.as_str()),
                      None => (0, ""),
                  };
                  return format!(
                      "{MANIFEST_MAGIC_V2}\ngeneration={}\ndim={}\nitems={}\ndefault_shortlist={}\noctasoma_version={}\nembedding={}\nprojection={}\nquantization={}\nindex={}\nscirust_revision={}\ncalibration_present={}\ncalibration={}\ntree_sha256={}\nsketch_sha256={}\n",
                      manifest.generation,
                      manifest.dim,
                      manifest.items,
                      manifest.default_shortlist,
                      manifest.octasoma_version,
                      fingerprint.embedding,
                      fingerprint.projection,
                      fingerprint.quantization,
                      fingerprint.index,
                      fingerprint.scirust_revision,
                      calibration_present,
                      calibration,
                      manifest.tree_sha256,
                      manifest.sketch_sha256,
                  );
              }
              format!(
                  "{MANIFEST_MAGIC_V1}\ngeneration={}\ndim={}\nitems={}\ndefault_shortlist={}\noctasoma_version={}\ntree_sha256={}\nsketch_sha256={}\n",
                  manifest.generation,
                  manifest.dim,
                  manifest.items,
                  manifest.default_shortlist,
                  manifest.octasoma_version,
                  manifest.tree_sha256,
                  manifest.sketch_sha256,
              )
          }

          fn parse_manifest(raw: &str) -> io::Result<Manifest> {
              let lines: Vec<&str> = raw.lines().collect();
              if lines.first() == Some(&MANIFEST_MAGIC_V1) {
                  return parse_manifest_v1(&lines);
              }
              if lines.first() == Some(&MANIFEST_MAGIC_V2) {
                  return parse_manifest_v2(&lines);
              }
              Err(invalid("invalid hybrid generation MANIFEST magic"))
          }

          fn parse_manifest_v1(lines: &[&str]) -> io::Result<Manifest> {
              if lines.len() != 8 {
                  return Err(invalid("invalid v1 hybrid generation MANIFEST field count"));
              }
              let generation = parse_number(lines[1], "generation=")?;
              let dim = parse_number(lines[2], "dim=")?;
              let items = parse_number(lines[3], "items=")?;
              let default_shortlist = parse_number(lines[4], "default_shortlist=")?;
              if default_shortlist == 0 {
                  return Err(invalid("MANIFEST default_shortlist must be non-zero"));
              }
              let octasoma_version = required_value(lines[5], "octasoma_version=")?.to_string();
              let tree_sha256 = parse_hash(lines[6], "tree_sha256=")?;
              let sketch_sha256 = parse_hash(lines[7], "sketch_sha256=")?;
              Ok(Manifest {
                  generation,
                  dim,
                  items,
                  default_shortlist,
                  octasoma_version,
                  fingerprint: None,
                  tree_sha256,
                  sketch_sha256,
              })
          }

          fn parse_manifest_v2(lines: &[&str]) -> io::Result<Manifest> {
              if lines.len() != 15 {
                  return Err(invalid("invalid v2 hybrid generation MANIFEST field count"));
              }
              let generation = parse_number(lines[1], "generation=")?;
              let dim = parse_number(lines[2], "dim=")?;
              let items = parse_number(lines[3], "items=")?;
              let default_shortlist = parse_number(lines[4], "default_shortlist=")?;
              if default_shortlist == 0 {
                  return Err(invalid("MANIFEST default_shortlist must be non-zero"));
              }
              let octasoma_version = required_value(lines[5], "octasoma_version=")?.to_string();
              let calibration_present: u8 = parse_number(lines[11], "calibration_present=")?;
              let calibration_raw = lines[12]
                  .strip_prefix("calibration=")
                  .ok_or_else(|| invalid("missing MANIFEST field calibration="))?;
              let calibration = match calibration_present {
                  0 if calibration_raw.is_empty() => None,
                  0 => return Err(invalid("calibration value present while calibration_present=0")),
                  1 if !calibration_raw.is_empty() => Some(calibration_raw.to_string()),
                  1 => return Err(invalid("calibration_present=1 but calibration is empty")),
                  _ => return Err(invalid("calibration_present must be 0 or 1")),
              };
              let fingerprint = GenerationFingerprint {
                  embedding: required_value(lines[6], "embedding=")?.to_string(),
                  projection: required_value(lines[7], "projection=")?.to_string(),
                  quantization: required_value(lines[8], "quantization=")?.to_string(),
                  index: required_value(lines[9], "index=")?.to_string(),
                  scirust_revision: required_value(lines[10], "scirust_revision=")?.to_string(),
                  calibration,
              };
              fingerprint.validate().map_err(|err| {
                  invalid(&format!("invalid persisted generation fingerprint: {err}"))
              })?;
              let tree_sha256 = parse_hash(lines[13], "tree_sha256=")?;
              let sketch_sha256 = parse_hash(lines[14], "sketch_sha256=")?;
              Ok(Manifest {
                  generation,
                  dim,
                  items,
                  default_shortlist,
                  octasoma_version,
                  fingerprint: Some(fingerprint),
                  tree_sha256,
                  sketch_sha256,
              })
          }

          '''
          text = text[:start] + manifest_code + text[end:]

          insertion = r'''

              #[test]
              fn strict_fingerprint_roundtrip_and_mismatch_rejection() {
                  let root = temp_store("fingerprint");
                  let memory = populated(41);
                  let fingerprint = GenerationFingerprint::canonical(
                      "embed:test:v1",
                      "jl:seed=42",
                      "f32",
                      "simhash:64",
                  )
                  .with_calibration("rcps:sha256:abc123");
                  save_with_fingerprint(&memory, root.to_string_lossy().as_ref(), &fingerprint)
                      .unwrap();

                  let reopened = open_with_fingerprint(
                      root.to_string_lossy().as_ref(),
                      4,
                      &fingerprint,
                  )
                  .unwrap();
                  assert_eq!(reopened.len(), 1);
                  assert_eq!(reopened.default_shortlist, 41);

                  let mut wrong = fingerprint.clone();
                  wrong.embedding = "embed:test:v2".into();
                  let err = open_with_fingerprint(
                      root.to_string_lossy().as_ref(),
                      4,
                      &wrong,
                  )
                  .err()
                  .expect("mismatched interpretation unexpectedly opened");
                  assert_eq!(err.kind(), io::ErrorKind::InvalidData);
                  assert!(err.to_string().contains("interpretation fingerprint mismatch"));

                  // Compatibility API remains integrity-only and can read v2.
                  assert_eq!(open(root.to_string_lossy().as_ref(), 4).unwrap().len(), 1);
                  let _ = fs::remove_dir_all(root);
              }

              #[test]
              fn strict_fingerprint_open_refuses_unbound_generation() {
                  let root = temp_store("unbound");
                  let memory = populated(43);
                  save(&memory, root.to_string_lossy().as_ref()).unwrap();
                  let fingerprint = GenerationFingerprint::canonical(
                      "embed:test:v1",
                      "jl:seed=42",
                      "f32",
                      "simhash:64",
                  );
                  let err = open_with_fingerprint(
                      root.to_string_lossy().as_ref(),
                      4,
                      &fingerprint,
                  )
                  .err()
                  .expect("unbound generation unexpectedly opened strictly");
                  assert_eq!(err.kind(), io::ErrorKind::InvalidData);
                  assert!(err.to_string().contains("unbound generation"));
                  let _ = fs::remove_dir_all(root);
              }
          '''
          close = text.rfind("\n}")
          if close < 0:
              raise SystemExit("tests module closing brace not found")
          text = text[:close] + insertion + text[close:]
          gen.write_text(text)
          PY
      - name: Format
        run: cargo +1.89.0 fmt --all
      - name: Validate strict generation fingerprints
        run: |
          cargo +1.89.0 check --locked
          cargo +1.89.0 test --release --lib --locked
          cargo +1.89.0 clippy --all-targets --locked -- -D warnings
          cargo +1.89.0 check --features mcp --locked
          cargo +1.89.0 check --features simd --locked
      - name: Commit validated implementation
        shell: bash
        run: |
          git config user.name "ZEKRITI Tarek"
          git config user.email "contact@checkupauto.fr"
          git rm .github/workflows/apply-generation-fingerprints.yml
          git add src/generation_fingerprint.rs src/generation_store.rs src/hybrid.rs src/lib.rs
          git commit -m "feat(store): bind generations to interpretation fingerprints"
          git push origin HEAD:feat/v05-generation-fingerprints
