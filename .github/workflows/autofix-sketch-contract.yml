name: Apply sketch contract hardening

on:
  push:
    branches:
      - fix/sketch-contract

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/sketch-contract
      - name: Harden SketchIndex invariants
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("src/sketch.rs")
          text = path.read_text()

          def replace_exact(old, new, expected=1, name="anchor"):
              global text
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f"{name}: expected {expected}, found {count}")
              text = text.replace(old, new)

          replace_exact(
              """    /// Inserts an `embedding` with a byte `payload`. Returns `false` (and stores\n    /// nothing) if `embedding.len() != dim`.\n    pub fn insert(&mut self, embedding: &[f32], payload: &[u8]) -> bool {\n        if embedding.len() != self.dim {\n            return false;\n        }\n""",
              """    /// Inserts an `embedding` with a byte `payload`. Returns `false` (and stores\n    /// nothing) if the vector has the wrong dimension or contains a non-finite value.\n    pub fn insert(&mut self, embedding: &[f32], payload: &[u8]) -> bool {\n        if embedding.len() != self.dim || embedding.iter().any(|x| !x.is_finite()) {\n            return false;\n        }\n""",
              name="insert contract",
          )
          replace_exact(
              """        if query.len() != self.dim || k == 0 || self.is_empty() {\n            return Vec::new();\n        }\n        let qs = self.sketch_with_path(query);\n""",
              """        if query.len() != self.dim\n            || query.iter().any(|x| !x.is_finite())\n            || k == 0\n            || self.is_empty()\n        {\n            return Vec::new();\n        }\n        let qs = self.sketch_with_path(query);\n""",
              expected=2,
              name="query guards",
          )
          replace_exact(
              """            cand.select_nth_unstable_by_key(m - 1, |(h, _)| *h);\n            cand.truncate(m);\n""",
              """            cand.select_nth_unstable_by_key(m - 1, |(h, i)| (*h, *i));\n            cand.truncate(m);\n""",
              name="nearest_ids shortlist",
          )
          replace_exact(
              """        let valid: Vec<&Vec<f32>> = queries.iter().filter(|q| q.len() == self.dim).collect();\n""",
              """        let valid: Vec<&Vec<f32>> = queries\n            .iter()\n            .filter(|q| q.len() == self.dim && q.iter().all(|x| x.is_finite()))\n            .collect();\n""",
              name="certificate calibration filter",
          )
          replace_exact(
              """        cand.select_nth_unstable_by_key(k - 1, |(h, _)| *h);\n        cand.truncate(k);\n        cand.sort_by_key(|(h, _)| *h);\n""",
              """        cand.select_nth_unstable_by_key(k - 1, |(h, i)| (*h, *i));\n        cand.truncate(k);\n        cand.sort_unstable_by_key(|(h, i)| (*h, *i));\n""",
              name="nearest_sketch total order",
          )
          replace_exact(
              """        cand.select_nth_unstable_by_key(m - 1, |(h, _)| *h);\n        cand.truncate(m);\n        cand.into_iter().map(|(_, id)| id).collect()\n""",
              """        cand.select_nth_unstable_by_key(m - 1, |(h, id)| (*h, *id));\n        cand.truncate(m);\n        cand.sort_unstable_by_key(|(h, id)| (*h, *id));\n        cand.into_iter().map(|(_, id)| id).collect()\n""",
              name="hamming_rank total order",
          )
          old_sort = "        scored.sort_by(|a, b| b.0.total_cmp(&a.0));\n        scored.truncate(k);\n"
          sort_count = text.count(old_sort)
          if sort_count < 1:
              raise SystemExit("score sort: no anchors found")
          text = text.replace(
              old_sort,
              "        scored.sort_by(|a, b| b.0.total_cmp(&a.0).then(a.1.cmp(&b.1)));\n        scored.truncate(k);\n",
          )
          test_anchor = """    #[test]\n    fn normalize_on_insert_makes_cosine_a_dot() {\n"""
          tests = """    #[test]\n    fn rejects_non_finite_embeddings_and_queries() {\n        let mut idx = SketchIndex::new(4, 64, 7);\n        assert!(!idx.insert(&[1.0, f32::NAN, 0.0, 0.0], b\"nan\"));\n        assert!(!idx.insert(&[1.0, f32::INFINITY, 0.0, 0.0], b\"inf\"));\n        assert!(idx.is_empty());\n        assert!(idx.insert(&[1.0, 0.0, 0.0, 0.0], b\"ok\"));\n        assert!(idx.nearest(&[f32::NAN, 0.0, 0.0, 0.0], 1, 1).is_empty());\n        assert!(idx.nearest_sketch(&[f32::INFINITY, 0.0, 0.0, 0.0], 1).is_empty());\n    }\n\n    #[test]\n    fn hamming_ties_have_deterministic_nested_prefixes() {\n        let mut idx = SketchIndex::new(4, 64, 11);\n        for i in 0..8u8 {\n            assert!(idx.insert(&[1.0, 0.0, 0.0, 0.0], &[i]));\n        }\n        let q = [1.0, 0.0, 0.0, 0.0];\n        assert_eq!(\n            idx.nearest_sketch(&q, 3)\n                .into_iter()\n                .map(|(payload, _)| payload[0])\n                .collect::<Vec<_>>(),\n            vec![0, 1, 2]\n        );\n        let ids: Vec<u32> = (0..8).collect();\n        assert_eq!(idx.hamming_rank(&q, &ids, 3), vec![0, 1, 2]);\n        assert_eq!(idx.hamming_rank(&q, &ids, 6), vec![0, 1, 2, 3, 4, 5]);\n    }\n\n"""
          replace_exact(test_anchor, tests + test_anchor, name="test insertion")
          path.write_text(text)
          PY
      - name: Validate library contract, commit, and remove helper workflow
        shell: bash
        run: |
          cargo fmt --all
          cargo test --release --lib
          cargo clippy --lib -- -D warnings
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/sketch.rs
          git rm .github/workflows/autofix-sketch-contract.yml
          git commit -m "fix(sketch): make certified shortlists deterministic"
          git push origin HEAD:fix/sketch-contract
