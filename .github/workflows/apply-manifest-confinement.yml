name: Apply manifest confinement hardening

on:
  push:
    branches:
      - fix/manifest-path-confinement

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/manifest-path-confinement
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply strict manifest component guards
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('src/fileguard.rs')
          s = p.read_text()
          s = s.replace(
              'use std::io::{self, Read};\n',
              'use std::io::{self, Read};\nuse std::path::Path;\n',
              1,
          )
          anchor = '/// Rejects a payload `(offset, len)` record that falls outside the decompressed\n'
          helpers = '''/// Rejects a manifest-selected path component unless it is exactly the
/// deterministic name generated by the writer. Requiring an exact generated
/// component is stronger than merely rejecting `..`/absolute paths: renamed,
/// nested, platform-specific and separator-bearing paths are all invalid.
pub(crate) fn guard_generated_component(
    what: &str,
    actual: &str,
    expected: &str,
) -> io::Result<()> {
    if actual != expected {
        return Err(invalid(format!(
            "{what}: expected generated component {expected:?}, got {actual:?}"
        )));
    }
    Ok(())
}

/// Refuses to follow a symbolic link at a persistence trust boundary.
///
/// `symlink_metadata` deliberately inspects the link itself rather than its
/// target. Missing paths retain their normal I/O error instead of being mapped
/// to `InvalidData`.
pub(crate) fn guard_not_symlink(what: &str, path: &Path) -> io::Result<()> {
    let metadata = std::fs::symlink_metadata(path)?;
    if metadata.file_type().is_symlink() {
        return Err(invalid(format!(
            "{what}: symbolic links are not allowed in an OctaSoma store: {}",
            path.display()
        )));
    }
    Ok(())
}

/// Requires an in-memory manifest parser to consume the entire input.
pub(crate) fn guard_no_trailing_bytes(what: &str, remaining: usize) -> io::Result<()> {
    if remaining != 0 {
        return Err(invalid(format!(
            "{what}: {remaining} trailing bytes remain after the declared records"
        )));
    }
    Ok(())
}

'''
          if s.count(anchor) != 1:
