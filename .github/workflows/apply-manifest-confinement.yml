name: Apply manifest confinement hardening

on:
  push:
    branches: [fix/manifest-path-confinement]

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/manifest-path-confinement
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply strict manifest guards
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              n = text.count(old)
              if n != 1:
                  raise SystemExit(f"{label}: expected 1 anchor, found {n}")
              return text.replace(old, new, 1)

          p = Path("src/fileguard.rs")
          s = p.read_text()
          s = replace_once(s, "use std::io::{self, Read};\n", "use std::io::{self, Read};\nuse std::path::Path;\n", "Path import")
          anchor = "/// Rejects a payload `(offset, len)` record that falls outside the decompressed\n"
          helpers = "/// Requires a manifest-selected component to match the deterministic writer name exactly.\npub(crate) fn guard_generated_component(what: &str, actual: &str, expected: &str) -> io::Result<()> {\n    if actual != expected {\n        return Err(invalid(format!(\"{what}: expected generated component {expected:?}, got {actual:?}\")));\n    }\n    Ok(())\n}\n\n/// Refuses symbolic links at persistence trust boundaries.\npub(crate) fn guard_not_symlink(what: &str, path: &Path) -> io::Result<()> {\n    let metadata = std::fs::symlink_metadata(path)?;\n    if metadata.file_type().is_symlink() {\n        return Err(invalid(format!(\"{what}: symbolic links are not allowed in an OctaSoma store: {}\", path.display())));\n    }\n    Ok(())\n}\n\n/// Requires a manifest parser to consume the complete input.\npub(crate) fn guard_no_trailing_bytes(what: &str, remaining: usize) -> io::Result<()> {\n    if remaining != 0 {\n        return Err(invalid(format!(\"{what}: {remaining} trailing bytes remain after the declared records\")));\n    }\n    Ok(())\n}\n\n"
          s = replace_once(s, anchor, helpers + anchor, "fileguard helpers")
          test_anchor = "    #[test]\n    fn guard_payload_bounds_catches_out_of_arena_records() {\n"
          tests = "    #[test]\n    fn generated_component_guard_is_exact() {\n        assert!(guard_generated_component(\"shard\", \"shard_00000000\", \"shard_00000000\").is_ok());\n        for hostile in [\"../escape\", \"/tmp/escape\", \"shard_00000000/child\", \"shard_00000001\"] {\n            assert!(guard_generated_component(\"shard\", hostile, \"shard_00000000\").is_err());\n        }\n    }\n\n    #[test]\n    fn trailing_bytes_are_rejected() {\n        assert!(guard_no_trailing_bytes(\"manifest\", 0).is_ok());\n        assert!(guard_no_trailing_bytes(\"manifest\", 1).is_err());\n    }\n\n"
          s = replace_once(s, test_anchor, tests + test_anchor, "fileguard tests")
          p.write_text(s)

          p = Path("src/sharded.rs")
          s = p.read_text()
          old = "        let mut shards = HashMap::with_capacity(count);\n        for _ in 0..count {\n            let region = read_string(&mut r)?;\n            let fname = read_string(&mut r)?;\n            let shard = FractalMemory3D::load_from_disk(&format!(\"{dir}/{fname}\"), high_dim)?;\n            shards.insert(region, shard);\n        }\n        Ok(Self {\n"
          new = "        let mut shards = HashMap::with_capacity(count);\n        for i in 0..count {\n            let region = read_string(&mut r)?;\n            let fname = read_string(&mut r)?;\n            let expected = format!(\"shard_{i:08}.frac\");\n            crate::fileguard::guard_generated_component(\"manifest shard file\", &fname, &expected)?;\n            let path = std::path::Path::new(dir).join(&fname);\n            crate::fileguard::guard_not_symlink(\"manifest shard file\", &path)?;\n            let shard = FractalMemory3D::load_from_disk(path.to_string_lossy().as_ref(), high_dim)?;\n            shards.insert(region, shard);\n        }\n        crate::fileguard::guard_no_trailing_bytes(\"shard manifest\", r.len())?;\n        Ok(Self {\n"
          s = replace_once(s, old, new, "sharded loader")
          p.write_text(s)

          p = Path("src/hybrid.rs")
          s = p.read_text()
          old = "    pub fn open_dir(dir: &str, dim: usize) -> io::Result<Self> {\n        let tree = FractalMemory3D::load_from_disk(&format!(\"{dir}/tree.frac\"), dim)?;\n        let sketch = SketchIndex::load_from_disk(&format!(\"{dir}/index.skch\"), dim)?;\n        Ok(Self {\n"
          new = "    pub fn open_dir(dir: &str, dim: usize) -> io::Result<Self> {\n        let root = std::path::Path::new(dir);\n        let tree_path = root.join(\"tree.frac\");\n        let sketch_path = root.join(\"index.skch\");\n        crate::fileguard::guard_not_symlink(\"hybrid tree\", &tree_path)?;\n        crate::fileguard::guard_not_symlink(\"hybrid sketch\", &sketch_path)?;\n        let tree = FractalMemory3D::load_from_disk(tree_path.to_string_lossy().as_ref(), dim)?;\n        let sketch = SketchIndex::load_from_disk(sketch_path.to_string_lossy().as_ref(), dim)?;\n        Ok(Self {\n"
          s = replace_once(s, old, new, "hybrid fixed files")
          old = "        let mut shards = HashMap::with_capacity(count);\n        for _ in 0..count {\n            let region = read_string(&mut r)?;\n            let name = read_string(&mut r)?;\n            let hm = HybridMemory::open_dir(&format!(\"{dir}/{name}\"), dim)?;\n            shards.insert(region, hm);\n        }\n        Ok(Self {\n"
          new = "        let mut shards = HashMap::with_capacity(count);\n        for i in 0..count {\n            let region = read_string(&mut r)?;\n            let name = read_string(&mut r)?;\n            let expected = format!(\"shard_{i:08}\");\n            crate::fileguard::guard_generated_component(\"hybrid manifest shard\", &name, &expected)?;\n            let path = std::path::Path::new(dir).join(&name);\n            crate::fileguard::guard_not_symlink(\"hybrid manifest shard\", &path)?;\n            let hm = HybridMemory::open_dir(path.to_string_lossy().as_ref(), dim)?;\n            shards.insert(region, hm);\n        }\n        crate::fileguard::guard_no_trailing_bytes(\"sharded-hybrid manifest\", r.len())?;\n        Ok(Self {\n"
          s = replace_once(s, old, new, "hybrid sharded loader")
          p.write_text(s)
          PY
          cargo fmt --all
      - name: Validate
        shell: bash
        run: |
          cargo test --release --lib
          cargo clippy --all-targets -- -D warnings
      - name: Commit with actual automation identity
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/fileguard.rs src/sharded.rs src/hybrid.rs
          git rm .github/workflows/apply-manifest-confinement.yml
          git commit -m "fix(store): confine manifest-selected shard paths"
          git push origin HEAD:fix/manifest-path-confinement
