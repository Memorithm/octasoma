name: Apply MCP lint fix

on:
  push:
    branches:
      - fix/validated-embedding-ingestion

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/validated-embedding-ingestion
      - name: Apply exact source fix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("src/bin/octasoma-mcp.rs")
          text = path.read_text()
          old = "if !(MIN_BITS..=MAX_BITS).contains(&bits) || bits % 64 != 0 {"
          new = "if !(MIN_BITS..=MAX_BITS).contains(&bits) || !bits.is_multiple_of(64) {"
          count = text.count(old)
          if count != 1:
              raise SystemExit(f"expected exactly one MCP bits guard, found {count}")
          path.write_text(text.replace(old, new))
          PY
      - name: Commit source fix and remove helper workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/bin/octasoma-mcp.rs
          git rm .github/workflows/autofix-mcp-lint.yml
          git commit -m "fix(mcp): use is_multiple_of for bit validation"
          git push origin HEAD:fix/validated-embedding-ingestion
