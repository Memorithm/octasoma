name: Apply published-generation semantics

on:
  push:
    branches: ["fix/v05-published-generations-only"]

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.89.0
        with:
          components: rustfmt,clippy
      - name: Apply publication hardening
        run: python3 .github/scripts/apply_published_generation_semantics.py
      - name: Validate store contract
        run: |
          cargo +1.89.0 fmt --all
          cargo +1.89.0 check --locked
          cargo +1.89.0 test --release --lib --locked
          cargo +1.89.0 clippy --all-targets --locked -- -D warnings
          cargo +1.89.0 check --features mcp --locked
          cargo +1.89.0 check --features simd --locked
      - name: Publish clean source commit
        run: |
          git config user.name "ZEKRITI Tarek"
          git config user.email "contact@checkupauto.fr"
          git rm .github/scripts/apply_published_generation_semantics.py .github/workflows/apply-published-generations-only.yml
          git add src/generation_store.rs
          git commit -m "fix(store): require explicit generation publication"
          git push origin HEAD:fix/v05-published-generations-only
