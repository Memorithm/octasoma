name: Apply autosave durability state

on:
  push:
    branches:
      - fix/autosave-durability-state

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/autosave-durability-state
      - uses: dtolnay/rust-toolchain@1.89
        with:
          components: rustfmt, clippy
      - name: Apply autosave durability patch
        run: python3 .github/scripts/apply_autosave_durability.py
      - name: Validate autosave contract
        run: |
          cargo fmt --all
          cargo test --release --test agent_kernel
          cargo test --release --lib
          cargo clippy --all-targets -- -D warnings
      - name: Commit validated source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-autosave-durability.yml .github/scripts/apply_autosave_durability.py
          git add src/kernel.rs src/lib.rs tests/agent_kernel.rs
          git commit -m "fix(kernel): expose autosave durability failures"
          git push origin HEAD:fix/autosave-durability-state
