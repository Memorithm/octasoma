name: Apply shared SimHash projector

on:
  push:
    branches: [perf/v05-shared-simhash-projector]

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: perf/v05-shared-simhash-projector
      - uses: dtolnay/rust-toolchain@1.89
        with:
          components: rustfmt, clippy
      - name: Share projector hyperplanes across hybrid shards
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def once(s, old, new, label):
              n = s.count(old)
              if n != 1:
                  raise SystemExit(f"{label}: expected 1 anchor, found {n}")
              return s.replace(old, new, 1)

          p = Path('src/sketch.rs')
          s = p.read_text()
          s = once(s, 'use std::io::{self, BufWriter, Read, Write};\n', 'use std::io::{self, BufWriter, Read, Write};\nuse std::sync::Arc;\n', 'Arc import')
          s = once(s, '    hasher: SimHasher,\n', '    hasher: Arc<SimHasher>,\n', 'hasher field')
          old = '        let hasher = SimHasher::new(dim, bits, seed);\n        let store = match precision {\n'
          new = '        let hasher = Arc::new(SimHasher::new(dim, bits, seed));\n        Self::new_with_shared_hasher(hasher, seed, precision)\n    }\n\n    /// Internal constructor used by sharded stores so identical hyperplanes are\n    /// allocated once and shared by every regional precision index.\n    pub(crate) fn new_with_shared_hasher(\n        hasher: Arc<SimHasher>,\n        seed: u64,\n        precision: Precision,\n    ) -> Self {\n        let dim = hasher.dim();\n        let store = match precision {\n'
          s = once(s, old, new, 'constructor split')
          # The existing Self block remains valid after the moved store construction.
          old = '    /// Switches this store to **SIMD sketching** (proposal A3): every sketch —\n'
          helper = '    /// Replaces an equivalent regenerated projector by a shared allocation.\n    pub(crate) fn share_hasher(&mut self, hasher: Arc<SimHasher>, seed: u64) -> io::Result<()> {\n        if seed != self.seed || hasher.dim() != self.dim || hasher.bits() != self.bits() {\n            return Err(invalid(\"shared SimHash projector does not match index identity\"));\n        }\n        self.hasher = hasher;\n        Ok(())\n    }\n\n    #[cfg(test)]\n    pub(crate) fn shares_hasher_with(&self, other: &Self) -> bool {\n        Arc::ptr_eq(&self.hasher, &other.hasher)\n    }\n\n'
          s = once(s, old, helper + old, 'share_hasher methods')
          s = once(s, '            hasher: SimHasher::new(dim, bits, seed),\n', '            hasher: Arc::new(SimHasher::new(dim, bits, seed)),\n', 'load hasher')
          # Expose the actual projector footprint for diagnostics/benchmarks.
          old = '    /// Number of `u64` words in a sketch (`bits / 64`).\n'
          extra = '    /// Heap bytes occupied by the hyperplane matrix.\n    pub fn plane_bytes(&self) -> usize {\n        self.planes.len() * std::mem::size_of::<f32>()\n    }\n\n'
          s = once(s, old, extra + old, 'plane bytes')
          p.write_text(s)

          p = Path('src/hybrid.rs')
          s = p.read_text()
          s = once(s, 'use std::io::{self, Read};\n', 'use std::io::{self, Read};\nuse std::sync::Arc;\n', 'hybrid Arc import')
          s = once(s, 'use crate::{Explanation, FractalMemory3D, RegionView, SketchIndex};\n', 'use crate::{Explanation, FractalMemory3D, Precision, RegionView, SimHasher, SketchIndex};\n\nconst SKETCH_SEED_XOR: u64 = 0x9E37_79B9_7F4A_7C15;\n', 'hybrid imports')
          old = '    pub fn new(dim: usize, seed: u64, bits: usize) -> Self {\n        Self {\n            tree: FractalMemory3D::new(dim, seed),\n            // Decorrelate the sketch hyperplanes from the JL projection.\n            sketch: SketchIndex::new(dim, bits, seed ^ 0x9E37_79B9_7F4A_7C15),\n            dim,\n            default_shortlist: 256,\n        }\n    }\n'
          new = '    pub fn new(dim: usize, seed: u64, bits: usize) -> Self {\n        let sketch_seed = seed ^ SKETCH_SEED_XOR;\n        let projector = Arc::new(SimHasher::new(dim, bits, sketch_seed));\n        Self::new_with_shared_projector(dim, seed, sketch_seed, projector)\n    }\n\n    fn new_with_shared_projector(\n        dim: usize,\n        seed: u64,\n        sketch_seed: u64,\n        projector: Arc<SimHasher>,\n    ) -> Self {\n        Self {\n            tree: FractalMemory3D::new(dim, seed),\n            sketch: SketchIndex::new_with_shared_hasher(projector, sketch_seed, Precision::F32),\n            dim,\n            default_shortlist: 256,\n        }\n    }\n\n    fn share_projector(&mut self, projector: Arc<SimHasher>, sketch_seed: u64) -> io::Result<()> {\n        self.sketch.share_hasher(projector, sketch_seed)\n    }\n\n    #[cfg(test)]\n    fn shares_projector_with(&self, other: &Self) -> bool {\n        self.sketch.shares_hasher_with(&other.sketch)\n    }\n'
          s = once(s, old, new, 'HybridMemory shared constructor')
          s = once(s, '    bits: usize,\n}\n\nimpl<E: Embedder> ShardedHybrid<E> {\n', '    bits: usize,\n    projector: Arc<SimHasher>,\n}\n\nimpl<E: Embedder> ShardedHybrid<E> {\n', 'projector field')
          old = '    pub fn new(embedder: E, bits: usize) -> Self {\n        Self {\n            shards: HashMap::new(),\n            embedder,\n            seed: 42,\n            bits,\n        }\n    }\n'
          new = '    pub fn new(embedder: E, bits: usize) -> Self {\n        let seed = 42;\n        let projector = Arc::new(SimHasher::new(\n            embedder.dim(),\n            bits,\n            seed ^ SKETCH_SEED_XOR,\n        ));\n        Self {\n            shards: HashMap::new(),\n            embedder,\n            seed,\n            bits,\n            projector,\n        }\n    }\n\n    /// Bytes used by the single shared SimHash hyperplane matrix.\n    pub fn projector_bytes(&self) -> usize {\n        self.projector.plane_bytes()\n    }\n'
          s = once(s, old, new, 'ShardedHybrid new')
          old = '        let (dim, seed, bits) = (self.embedder.dim(), self.seed, self.bits);\n        let shard = self\n            .shards\n            .entry(region.to_string())\n            .or_insert_with(|| HybridMemory::new(dim, seed, bits));\n'
          new = '        let (dim, seed) = (self.embedder.dim(), self.seed);\n        let sketch_seed = seed ^ SKETCH_SEED_XOR;\n        let projector = Arc::clone(&self.projector);\n        let shard = self\n            .shards\n            .entry(region.to_string())\n            .or_insert_with(|| {\n                HybridMemory::new_with_shared_projector(dim, seed, sketch_seed, projector)\n            });\n'
          s = once(s, old, new, 'shard creation')
          old = '        let count = read_u64(&mut r)? as usize;\n        // Each shard record is at least two length-prefixed strings (16 bytes).\n'
          new = '        let count = read_u64(&mut r)? as usize;\n        let sketch_seed = seed ^ SKETCH_SEED_XOR;\n        let projector = Arc::new(SimHasher::new(dim, bits, sketch_seed));\n        // Each shard record is at least two length-prefixed strings (16 bytes).\n'
          s = once(s, old, new, 'open shared projector')
          old = '            let hm = HybridMemory::open_dir(path.to_string_lossy().as_ref(), dim)?;\n            shards.insert(region, hm);\n'
          new = '            let mut hm = HybridMemory::open_dir(path.to_string_lossy().as_ref(), dim)?;\n            hm.share_projector(Arc::clone(&projector), sketch_seed)?;\n            shards.insert(region, hm);\n'
          s = once(s, old, new, 'open replace projector')
          s = once(s, '            bits,\n        })\n    }\n}\n', '            bits,\n            projector,\n        })\n    }\n}\n', 'open self projector')
          marker = '    #[test]\n    fn calibrate_shortlist_installs_a_certified_default() {\n'
          test = '    #[test]\n    fn sharded_hybrid_shares_one_simhash_projector_across_regions_and_reload() {\n        let mut mem = ShardedHybrid::new(crate::HashEmbedder::new(16), 128);\n        mem.insert(\"a\", \"a:1\", \"alpha\").unwrap();\n        mem.insert(\"b\", \"b:1\", \"beta\").unwrap();\n        assert!(mem.shards[\"a\"].shares_projector_with(&mem.shards[\"b\"]));\n        assert_eq!(mem.projector_bytes(), 128 * 16 * std::mem::size_of::<f32>());\n\n        let dir = format!(\"/tmp/octasoma_shared_projector_{}\", std::process::id());\n        let _ = std::fs::remove_dir_all(&dir);\n        mem.save_dir(&dir).unwrap();\n        let reopened = ShardedHybrid::open_dir(crate::HashEmbedder::new(16), &dir).unwrap();\n        assert!(reopened.shards[\"a\"].shares_projector_with(&reopened.shards[\"b\"]));\n        assert_eq!(reopened.recall(\"a\", \"alpha\", 1).unwrap()[0].0, \"a:1\");\n        std::fs::remove_dir_all(dir).unwrap();\n    }\n\n'
          s = once(s, marker, test + marker, 'shared projector test')
          p.write_text(s)
          PY
          cargo fmt --all
      - name: Validate
        shell: bash
        run: |
          cargo test --release hybrid:: --lib
          cargo test --release
          cargo clippy --all-targets -- -D warnings
      - name: Commit with actual automation identity
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/sketch.rs src/hybrid.rs
          git rm .github/workflows/apply-shared-simhash.yml
          git commit -m "perf(v0.5): share SimHash projector across shards"
          git push origin HEAD:perf/v05-shared-simhash-projector
