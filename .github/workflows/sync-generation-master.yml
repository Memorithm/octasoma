name: Sync generation store with master

on:
  push:
    branches: [v05/generation-store]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: v05/generation-store
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.89
        with:
          components: rustfmt, clippy
      - name: Merge current master and validate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin master
          git merge --no-edit origin/master
          cargo fmt --all -- --check
          cargo check --locked
          cargo test --release generation:: --lib
          cargo test --release
          cargo clippy --all-targets -- -D warnings
      - name: Remove helper and publish synchronized branch
        shell: bash
        run: |
          git rm .github/workflows/sync-generation-master.yml
          git commit -m "ci(v0.5): remove generation sync helper"
          git push origin HEAD:v05/generation-store
