name: Apply MSRV-safe MCP lint fix

on:
  push:
    branches:
      - fix/mcp-msrv-clippy

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/mcp-msrv-clippy
      - name: Apply exact MCP guard fix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("src/bin/octasoma-mcp.rs")
          text = path.read_text()
          old = "if !(MIN_BITS..=MAX_BITS).contains(&bits) || bits % 64 != 0 {"
          new = "if !(MIN_BITS..=MAX_BITS).contains(&bits) || bits & 63 != 0 {"
          count = text.count(old)
          if count != 1:
              raise SystemExit(f"expected one MCP guard, found {count}")
          path.write_text(text.replace(old, new))
          PY
          cargo fmt --all
          cargo clippy --all-targets --features mcp -- -D warnings
      - name: Commit and remove helper workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/bin/octasoma-mcp.rs
          git rm .github/workflows/autofix-mcp-msrv.yml
          git commit -m "fix(mcp): keep bit validation compatible with MSRV 1.85"
          git push origin HEAD:fix/mcp-msrv-clippy
