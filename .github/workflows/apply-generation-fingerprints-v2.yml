name: Apply generation fingerprints v2

on:
  push:
    branches: ["feat/v05-generation-fingerprints"]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.89.0
        with:
          components: rustfmt,clippy
      - name: Apply interpretation binding
        run: |
          python3 <<'PY'
          from pathlib import Path

          def once(text: str, old: str, new: str, label: str) -> str:
              n = text.count(old)
              if n != 1:
                  raise SystemExit(f"{label}: expected one anchor, found {n}")
              return text.replace(old, new, 1)

          # Public module/export.
          p = Path('src/lib.rs')
          s = p.read_text()
          s = once(s, 'pub mod fractal;\nmod generation_store;\n',
                   'pub mod fractal;\nmod generation_fingerprint;\nmod generation_store;\n', 'lib module')
          s = once(s, 'pub use fractal::RegionView;\n',
                   'pub use fractal::RegionView;\npub use generation_fingerprint::{GenerationFingerprint, SCIRUST_REVISION};\n', 'lib export')
          p.write_text(s)

          # Add strict APIs without changing compatibility APIs.
          p = Path('src/hybrid.rs')
          s = p.read_text()
          save = '''    pub fn save_dir(&self, dir: &str) -> io::Result<()> {
              crate::generation_store::save(self, dir)
          }
          '''
          s = once(s, save, save + '''
              /// Persists a generation with an explicit interpretation fingerprint.
              /// Governed stores should use this path so model/projection/index drift
              /// is detected before any persisted bytes are interpreted.
              pub fn save_dir_with_fingerprint(
                  &self,
                  dir: &str,
                  fingerprint: &crate::GenerationFingerprint,
              ) -> io::Result<()> {
                  crate::generation_store::save_with_fingerprint(self, dir, fingerprint)
              }
          ''', 'hybrid save')
          open_api = '''    pub fn open_dir(dir: &str, dim: usize) -> io::Result<Self> {
              crate::generation_store::open(dir, dim)
          }
          '''
          s = once(s, open_api, open_api + '''
              /// Strictly opens a generation only when its persisted interpretation
              /// fingerprint exactly matches `expected`. Legacy and unbound stores
              /// are rejected rather than silently downgraded.
              pub fn open_dir_with_fingerprint(
                  dir: &str,
                  dim: usize,
                  expected: &crate::GenerationFingerprint,
              ) -> io::Result<Self> {
                  crate::generation_store::open_with_fingerprint(dir, dim, expected)
              }
          ''', 'hybrid open')
          p.write_text(s)

          p = Path('src/generation_store.rs')
          s = p.read_text()
          s = once(s, 'use crate::{FractalMemory3D, HybridMemory, SketchIndex};',
                   'use crate::{FractalMemory3D, GenerationFingerprint, HybridMemory, SketchIndex};', 'gen import')
          s = once(s, 'const MANIFEST_MAGIC: &str = "OCTASOMA-HYBRID-GENERATION-V1";',
                   'const MANIFEST_MAGIC_V1: &str = "OCTASOMA-HYBRID-GENERATION-V1";\nconst MANIFEST_MAGIC_V2: &str = "OCTASOMA-HYBRID-GENERATION-V2";', 'gen magic')
          s = once(s, 'const MAX_MANIFEST_BYTES: u64 = 4096;', 'const MAX_MANIFEST_BYTES: u64 = 16 * 1024;', 'gen max manifest')
          s = once(s, '    octasoma_version: String,\n    tree_sha256: String,',
                   '    octasoma_version: String,\n    fingerprint: Option<GenerationFingerprint>,\n    tree_sha256: String,', 'gen manifest field')

          save_head = 'pub(crate) fn save(memory: &HybridMemory, dir: &str) -> io::Result<()> {\n    let root = Path::new(dir);\n'
          save_new = '''pub(crate) fn save(memory: &HybridMemory, dir: &str) -> io::Result<()> {
              save_impl(memory, dir, None)
          }

          pub(crate) fn save_with_fingerprint(
              memory: &HybridMemory,
              dir: &str,
              fingerprint: &GenerationFingerprint,
          ) -> io::Result<()> {
              fingerprint.validate()?;
              save_impl(memory, dir, Some(fingerprint))
          }

          fn save_impl(
              memory: &HybridMemory,
              dir: &str,
              fingerprint: Option<&GenerationFingerprint>,
          ) -> io::Result<()> {
              let root = Path::new(dir);
          '''
          s = once(s, save_head, save_new, 'gen save head')
          s = once(s, '            octasoma_version: env!("CARGO_PKG_VERSION").to_string(),\n            tree_sha256,',
                   '            octasoma_version: env!("CARGO_PKG_VERSION").to_string(),\n            fingerprint: fingerprint.cloned(),\n            tree_sha256,', 'gen save manifest')

          open_head = 'pub(crate) fn open(dir: &str, dim: usize) -> io::Result<HybridMemory> {\n    let root = Path::new(dir);\n'
          open_new = '''pub(crate) fn open(dir: &str, dim: usize) -> io::Result<HybridMemory> {
              open_impl(dir, dim, None)
          }

          pub(crate) fn open_with_fingerprint(
              dir: &str,
              dim: usize,
              expected: &GenerationFingerprint,
          ) -> io::Result<HybridMemory> {
              expected.validate()?;
              open_impl(dir, dim, Some(expected))
          }

          fn open_impl(
              dir: &str,
              dim: usize,
              expected_fingerprint: Option<&GenerationFingerprint>,
          ) -> io::Result<HybridMemory> {
              let root = Path::new(dir);
          '''
          s = once(s, open_head, open_new, 'gen open head')
          s = once(s, 'return open_generation(root, &name, dim, Some(&expected_manifest_hash));',
                   '''return open_generation(
                      root,
                      &name,
                      dim,
                      Some(&expected_manifest_hash),
                      expected_fingerprint,
                  );''', 'gen current call')
          s = once(s, 'return open_generation(root, &generation_name(generation), dim, None);',
                   '''return open_generation(
                      root,
                      &generation_name(generation),
                      dim,
                      None,
                      expected_fingerprint,
                  );''', 'gen recovery call')
          legacy = '''    // Backward compatibility for v0.4 stores. New saves never write this layout.
              HybridMemory::open_legacy_dir(dir, dim)
          }
          '''
          s = once(s, legacy, '''    // Compatibility mode can read legacy v0.4. Strict mode never
              // downgrades to bytes that have no interpretation identity.
              if expected_fingerprint.is_some() {
                  return Err(invalid(
                      "strict fingerprint open refuses a legacy store with no interpretation binding",
                  ));
              }
              HybridMemory::open_legacy_dir(dir, dim)
          }
          ''', 'gen legacy')
          s = once(s, '    expected_manifest_hash: Option<&str>,\n) -> io::Result<HybridMemory> {',
                   '    expected_manifest_hash: Option<&str>,\n    expected_fingerprint: Option<&GenerationFingerprint>,\n) -> io::Result<HybridMemory> {', 'gen open_generation signature')

          # Insert exact fingerprint validation immediately before component paths.
          fn_pos = s.index('fn open_generation(')
          tree_anchor = '    let tree_path = generation_dir.join(TREE_FILE);'
          tree_pos = s.index(tree_anchor, fn_pos)
          check = '''    if let Some(expected) = expected_fingerprint {
              let actual = manifest.fingerprint.as_ref().ok_or_else(|| {
                  invalid("strict fingerprint open refuses an unbound generation")
              })?;
              if actual != expected {
                  return Err(invalid(
                      "hybrid generation interpretation fingerprint mismatch",
                  ));
              }
          }

          '''
          s = s[:tree_pos] + check + s[tree_pos:]

          # Replace manifest codec with backwards-compatible V1 + bound V2.
          start = s.index('fn encode_manifest(manifest: &Manifest) -> String {')
          end = s.index('fn parse_current(raw: &str)', start)
          codec = r'''fn encode_manifest(manifest: &Manifest) -> String {
              if let Some(f) = &manifest.fingerprint {
                  let (calibration_present, calibration) = match &f.calibration {
                      Some(value) => (1, value.as_str()),
                      None => (0, ""),
                  };
                  return format!(
                      "{MANIFEST_MAGIC_V2}\ngeneration={}\ndim={}\nitems={}\ndefault_shortlist={}\noctasoma_version={}\nembedding={}\nprojection={}\nquantization={}\nindex={}\nscirust_revision={}\ncalibration_present={}\ncalibration={}\ntree_sha256={}\nsketch_sha256={}\n",
                      manifest.generation, manifest.dim, manifest.items,
                      manifest.default_shortlist, manifest.octasoma_version,
                      f.embedding, f.projection, f.quantization, f.index,
                      f.scirust_revision, calibration_present, calibration,
                      manifest.tree_sha256, manifest.sketch_sha256,
                  );
              }
              format!(
                  "{MANIFEST_MAGIC_V1}\ngeneration={}\ndim={}\nitems={}\ndefault_shortlist={}\noctasoma_version={}\ntree_sha256={}\nsketch_sha256={}\n",
                  manifest.generation, manifest.dim, manifest.items,
                  manifest.default_shortlist, manifest.octasoma_version,
                  manifest.tree_sha256, manifest.sketch_sha256,
              )
          }

          fn parse_manifest(raw: &str) -> io::Result<Manifest> {
              let lines: Vec<&str> = raw.lines().collect();
              match lines.first().copied() {
                  Some(MANIFEST_MAGIC_V1) => parse_manifest_v1(&lines),
                  Some(MANIFEST_MAGIC_V2) => parse_manifest_v2(&lines),
                  _ => Err(invalid("invalid hybrid generation MANIFEST magic")),
              }
          }

          fn parse_manifest_v1(lines: &[&str]) -> io::Result<Manifest> {
              if lines.len() != 8 {
                  return Err(invalid("invalid v1 hybrid generation MANIFEST field count"));
              }
              let generation = parse_number(lines[1], "generation=")?;
              let dim = parse_number(lines[2], "dim=")?;
              let items = parse_number(lines[3], "items=")?;
              let default_shortlist = parse_number(lines[4], "default_shortlist=")?;
              if default_shortlist == 0 {
                  return Err(invalid("MANIFEST default_shortlist must be non-zero"));
              }
              Ok(Manifest {
                  generation,
                  dim,
                  items,
                  default_shortlist,
                  octasoma_version: required_value(lines[5], "octasoma_version=")?.to_string(),
                  fingerprint: None,
                  tree_sha256: parse_hash(lines[6], "tree_sha256=")?,
                  sketch_sha256: parse_hash(lines[7], "sketch_sha256=")?,
              })
          }

          fn parse_manifest_v2(lines: &[&str]) -> io::Result<Manifest> {
              if lines.len() != 15 {
                  return Err(invalid("invalid v2 hybrid generation MANIFEST field count"));
              }
              let generation = parse_number(lines[1], "generation=")?;
              let dim = parse_number(lines[2], "dim=")?;
              let items = parse_number(lines[3], "items=")?;
              let default_shortlist = parse_number(lines[4], "default_shortlist=")?;
              if default_shortlist == 0 {
                  return Err(invalid("MANIFEST default_shortlist must be non-zero"));
              }
              let calibration_present: u8 = parse_number(lines[11], "calibration_present=")?;
              let calibration_raw = lines[12]
                  .strip_prefix("calibration=")
                  .ok_or_else(|| invalid("missing MANIFEST field calibration="))?;
              let calibration = match calibration_present {
                  0 if calibration_raw.is_empty() => None,
                  1 if !calibration_raw.is_empty() => Some(calibration_raw.to_string()),
                  0 => return Err(invalid("calibration value present while calibration_present=0")),
                  1 => return Err(invalid("calibration_present=1 but calibration is empty")),
                  _ => return Err(invalid("calibration_present must be 0 or 1")),
              };
              let fingerprint = GenerationFingerprint {
                  embedding: required_value(lines[6], "embedding=")?.to_string(),
                  projection: required_value(lines[7], "projection=")?.to_string(),
                  quantization: required_value(lines[8], "quantization=")?.to_string(),
                  index: required_value(lines[9], "index=")?.to_string(),
                  scirust_revision: required_value(lines[10], "scirust_revision=")?.to_string(),
                  calibration,
              };
              fingerprint.validate().map_err(|e| {
                  invalid(&format!("invalid persisted generation fingerprint: {e}"))
              })?;
              Ok(Manifest {
                  generation,
                  dim,
                  items,
                  default_shortlist,
                  octasoma_version: required_value(lines[5], "octasoma_version=")?.to_string(),
                  fingerprint: Some(fingerprint),
                  tree_sha256: parse_hash(lines[13], "tree_sha256=")?,
                  sketch_sha256: parse_hash(lines[14], "sketch_sha256=")?,
              })
          }

          '''
          s = s[:start] + codec + s[end:]

          # Append focused regressions inside the existing test module.
          tests = r'''

              #[test]
              fn strict_fingerprint_roundtrip_and_mismatch_rejection() {
                  let root = temp_store("fingerprint");
                  let memory = populated(41);
                  let fingerprint = GenerationFingerprint::canonical(
                      "embed:test:v1", "jl:seed=42", "f32", "simhash:64",
                  )
                  .with_calibration("rcps:sha256:abc123");
                  save_with_fingerprint(&memory, root.to_string_lossy().as_ref(), &fingerprint)
                      .unwrap();
                  let reopened = open_with_fingerprint(
                      root.to_string_lossy().as_ref(), 4, &fingerprint,
                  )
                  .unwrap();
                  assert_eq!(reopened.len(), 1);
                  assert_eq!(reopened.default_shortlist, 41);

                  let mut wrong = fingerprint.clone();
                  wrong.embedding = "embed:test:v2".into();
                  let err = open_with_fingerprint(root.to_string_lossy().as_ref(), 4, &wrong)
                      .err()
                      .expect("mismatched interpretation unexpectedly opened");
                  assert_eq!(err.kind(), io::ErrorKind::InvalidData);
                  assert!(err.to_string().contains("interpretation fingerprint mismatch"));
                  assert_eq!(open(root.to_string_lossy().as_ref(), 4).unwrap().len(), 1);
                  let _ = fs::remove_dir_all(root);
              }

              #[test]
              fn strict_fingerprint_open_refuses_unbound_generation() {
                  let root = temp_store("unbound");
                  let memory = populated(43);
                  save(&memory, root.to_string_lossy().as_ref()).unwrap();
                  let fingerprint = GenerationFingerprint::canonical(
                      "embed:test:v1", "jl:seed=42", "f32", "simhash:64",
                  );
                  let err = open_with_fingerprint(
                      root.to_string_lossy().as_ref(), 4, &fingerprint,
                  )
                  .err()
                  .expect("unbound generation unexpectedly opened strictly");
                  assert_eq!(err.kind(), io::ErrorKind::InvalidData);
                  assert!(err.to_string().contains("unbound generation"));
                  let _ = fs::remove_dir_all(root);
              }
          '''
          close = s.rfind('\n}')
          if close < 0:
              raise SystemExit('test module close not found')
          s = s[:close] + tests + s[close:]
          p.write_text(s)
          PY
      - name: Format and validate
        run: |
          cargo +1.89.0 fmt --all
          cargo +1.89.0 check --locked
          cargo +1.89.0 test --release --lib --locked
          cargo +1.89.0 clippy --all-targets --locked -- -D warnings
          cargo +1.89.0 check --features mcp --locked
          cargo +1.89.0 check --features simd --locked
      - name: Publish validated source
        run: |
          git config user.name "ZEKRITI Tarek"
          git config user.email "contact@checkupauto.fr"
          git rm .github/workflows/apply-generation-fingerprints-v2.yml
          git add src/generation_fingerprint.rs src/generation_store.rs src/hybrid.rs src/lib.rs
          git commit -m "feat(store): bind generations to interpretation fingerprints"
          git push origin HEAD:feat/v05-generation-fingerprints
