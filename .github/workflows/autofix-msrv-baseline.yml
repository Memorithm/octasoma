name: Restore MSRV-compatible baseline

on:
  push:
    branches:
      - fix/baseline-stable-197

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/baseline-stable-197
      - name: Restore benchmark semantics and MSRV-safe MCP guard
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          bench = Path("examples/benchmark.rs")
          text = bench.read_text()
          replacements = {
              "(pred[0] as usize).is_multiple_of(clusters) == q_cluster.is_multiple_of(clusters)": "pred[0] as usize % clusters == q_cluster",
              "(p as usize).is_multiple_of(clusters) == q_cluster.is_multiple_of(clusters)": "p as usize % clusters == q_cluster",
          }
          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"benchmark anchor expected once, found {count}: {old}")
              text = text.replace(old, new)
          bench.write_text(text)

          mcp = Path("src/bin/octasoma-mcp.rs")
          text = mcp.read_text()
          old = "!bits.is_multiple_of(64)"
          new = "bits & 63 != 0"
          count = text.count(old)
          if count != 1:
              raise SystemExit(f"MCP anchor expected once, found {count}")
          mcp.write_text(text.replace(old, new))
          PY
          cargo fmt --all
      - name: Validate current and MCP targets
        shell: bash
        run: |
          cargo fmt --all -- --check
          cargo clippy --all-targets -- -D warnings
          cargo clippy --all-targets --features mcp -- -D warnings
      - name: Commit and remove helper workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add examples/benchmark.rs src/bin/octasoma-mcp.rs
          git rm .github/workflows/autofix-msrv-baseline.yml
          git commit -m "fix(ci): preserve benchmark semantics at MSRV 1.85"
          git push origin HEAD:fix/baseline-stable-197
