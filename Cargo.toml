[package]
name = "octasoma"
version = "0.4.0"
edition = "2024"
rust-version = "1.89"
description = "3D fractal semantic memory engine: learned PCA/JL projection, bucket PR-octree, exact 3-D k-NN, and LZ4-compressed persistence — 100% safe, stable Rust"
license = "LicenseRef-CheckupAuto-Dual"
readme = "README.md"
repository = "https://github.com/Memorithm/octasoma"
keywords = ["octree", "semantic-memory", "knn", "pca", "embeddings"]
categories = ["data-structures", "science", "algorithms"]

[lib]
name = "octasoma"

[dependencies]
# OctaSoma v0.5 is SciRust-native. The retrieval crate is mandatory, pinned to
# the reviewed revision that introduced fine-grained external-consumer features.
# `default-features = false` keeps the base memory engine on the lightweight,
# deterministic vector/retrieval primitives without pulling learned/graph stacks.
scirust-retrieval = { git = "https://github.com/Memorithm/scirust", rev = "9b3d9492bb20e097231598a731df689ad4bd4bcc", default-features = false }
# Pure-Rust LZ4 codec for payload persistence.
lz4_flex = "0.11"
# SHA-256 integrity for immutable hybrid generation manifests/components.
sha2 = "0.10"
# Optional: pulled in only for the `mcp` feature (the JSON-RPC MCP server binary).
serde_json = { version = "1", optional = true }
# Optional: runtime-dispatched SIMD kernels (AVX2/SSE2/NEON with a scalar
# fallback) from the same pinned SciRust revision.
scirust-simd = { git = "https://github.com/Memorithm/scirust", rev = "9b3d9492bb20e097231598a731df689ad4bd4bcc", optional = true }
# Optional: the `gpu` feature only (proposal A5) — batched Q·Eᵀ scoring as one
# WGSL GEMM. This remains direct during the v0.5 transition; the target is the
# low-level SciRust GPU facade once the dependency direction is cycle-safe.
wgpu = { version = "0.20", optional = true }
pollster = { version = "0.3", optional = true }
bytemuck = { version = "1", optional = true }

[features]
# Builds the `octasoma-mcp` stdio JSON-RPC server (a connector for CCOS / agents).
mcp = ["dep:serde_json"]
# Opt-in **SIMD exact rerank** (proposal A2 of docs/scirust-improvements.md): the
# rerank dot product — the PrecisionSketch hot path, `scores()` and the certify
# oracle — dispatches to scirust-simd's runtime-detected AVX2/SSE2/NEON kernel
# (4–8× at 768-d). SIMD accumulation order differs from the scalar default, so
# scores can move in the last float bits and near-tie rankings may differ across
# builds/platforms — the flag IS that trade, stated plainly. Everything that
# persists (SimHash sketch bits, embeddings) stays on the scalar/f64 paths, so
# stores remain byte-portable across the flag.
simd = ["dep:scirust-simd"]
# Opt-in **GPU batch scoring** (A5): SketchIndex::scores_batch_gpu computes all
# queries × items cosines as one GEMM (viewer heat-maps, global recall,
# benchmark sweeps — the workloads that score everything). GPU accumulation is
# NOT bit-identical to the scalar path: tolerance-validated, never the default;
# no adapter → an honest Unsupported error. F32 tier only. See src/gpu.rs.
gpu = ["dep:wgpu", "dep:pollster", "dep:bytemuck"]

[dev-dependencies]
# Offline tuning/research dependencies stay dev-only but are pinned to the same
# canonical SciRust revision as the mandatory runtime foundation.
scirust-evo = { git = "https://github.com/Memorithm/scirust", rev = "9b3d9492bb20e097231598a731df689ad4bd4bcc" }
scirust-symreg = { git = "https://github.com/Memorithm/scirust", rev = "9b3d9492bb20e097231598a731df689ad4bd4bcc" }

[[bin]]
name = "octasoma-mcp"
required-features = ["mcp"]

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
